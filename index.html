    <!-- Application Logic -->
    <script type="module">
        const uid = () => Math.random().toString(36).slice(2, 10);
        const brl = (n) => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        const weekDays = ["D","S","T","Q","Q","S","S"];
        const todayISO = () => new Date().toISOString().slice(0, 10);
        const CATS = ["Alimentação","Transporte","Saúde","Moradia","Lazer","Compras","Outros"];

        // ================= SENHA DE ACESSO =================
        // Para trocar a senha, edite o valor abaixo.
        const APP_PASSWORD = "010123";
        const UNLOCK_KEY = "painel_pessoal_unlocked";

        const TABS = [
          { id: "plantoes", label: "Agenda & Plantões", icon: "calendar", accent: "#C9A24B" },
          { id: "financas", label: "Finanças & Faturas", icon: "wallet", accent: "#4F8C82" },
          { id: "investimentos", label: "Investimentos", icon: "trending-up", accent: "#7C8FD9" },
          { id: "projetos", label: "Projetos", icon: "target", accent: "#C2604A" },
        ];

        let state = {
          currentTab: "plantoes",
          shifts: [],
          appointments: [],
          cards: [
            { id: "card1", nome: "Cartão 1" },
            { id: "card2", nome: "Cartão 2" },
            { id: "card3", nome: "Cartão 3" },
          ],
          transactions: [], 
          pixTransactions: [], 
          incomes: [], 
          investments: [],
          projects: [],
          shiftCursor: { y: new Date().getFullYear(), m: new Date().getMonth() },
          financeCursor: { y: new Date().getFullYear(), m: new Date().getMonth() },
          selectedDay: todayISO(),
          showShiftForm: false,
          showAppointmentForm: false,
          editingShiftId: null,
          editingAppointmentId: null,
          shiftForm: { data: todayISO(), local: "", inicio: "19:00", fim: "07:00", valor: "", obs: "" },
          appointmentForm: { data: todayISO(), titulo: "", horario: "10:00", local: "", obs: "" },
          
          activeCardId: "card1",
          showTxForm: false,
          showPixForm: false,
          showIncomeForm: false,
          editingCardNameId: null,
          editingTxId: null,
          editingPixId: null,
          editingIncomeId: null,
          txForm: { descricao: "", valor: "", categoria: CATS[0], data: todayISO(), parcelas: "1" },
          pixForm: { descricao: "", valor: "", categoria: CATS[0], data: todayISO(), destino: "" },
          incomeForm: { descricao: "", valor: "", data: todayISO() },

          showInvForm: false,
          editingInvId: null,
          invForm: { nome: "", tipo: "Renda Fixa", indexador: "CDI", taxa: "100", valor: "", instituicao: "", data: todayISO() },
          rates: { cdi: null, selic: null, ipca12: null },
          ratesUpdatedAt: null,
          ratesLoading: false,
          ratesError: false,
          showProjForm: false,
          projForm: { titulo: "", descricao: "", prazo: "" },
          newTaskText: {}
        };

        let db = null;
        let docRef = null;
        let unsubscribe = null;
        let isSyncing = false;
        let saveTimer = null;
        let isRemoteUpdate = false;

        function loadLocal() {
          try {
            const saved = localStorage.getItem("painel_pessoal_bodi");
            if (saved) {
              const parsed = JSON.parse(saved);
              state.shifts = parsed.shifts || [];
              state.appointments = parsed.appointments || [];
              state.cards = parsed.cards || state.cards;
              state.transactions = parsed.transactions || [];
              state.pixTransactions = parsed.pixTransactions || [];
              state.incomes = parsed.incomes || [];
              state.investments = parsed.investments || [];
              state.projects = parsed.projects || [];
            }
          } catch(e) { console.error(e); }
        }

        function saveLocal() {
          try {
            localStorage.setItem("painel_pessoal_bodi", JSON.stringify({
              shifts: state.shifts,
              appointments: state.appointments,
              cards: state.cards,
              transactions: state.transactions,
              pixTransactions: state.pixTransactions,
              incomes: state.incomes,
              investments: state.investments,
              projects: state.projects
            }));

        // ================= TAXAS AUTOMÁTICAS (Banco Central - SGS) =================
        // Séries: 432 = Meta Selic (% a.a.) | 4391 = CDI acumulado no mês anualizado (% a.a.) | 13522 = IPCA acumulado 12 meses (%)
        const RATE_SERIES = { selic: 432, cdi: 4391, ipca12: 13522 };
        const RATE_LABELS = { selic: "SELIC", cdi: "CDI", ipca12: "IPCA (12m)" };

        // Busca um JSON tentando primeiro direto e, se falhar (bloqueio de CORS/rede), via um proxy público
        async function fetchJsonRobust(url) {
          try {
            const r = await fetch(url);
            if (!r.ok) throw new Error("HTTP " + r.status);
            return await r.json();
          } catch (e1) {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const r2 = await fetch(proxyUrl);
            if (!r2.ok) throw new Error("HTTP " + r2.status + " (proxy)");
            return await r2.json();
          }
        }

        async function fetchRates() {
          state.ratesLoading = true;
          render();
          let anyFailed = false;
          try {
            const entries = await Promise.all(
              Object.entries(RATE_SERIES).map(([key, code]) =>
                fetchJsonRobust(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${code}/dados/ultimos/1?formato=json`)
                  .then(d => [key, { valor: parseFloat(String(d[0].valor).replace(",", ".")), data: d[0].data }])
                  .catch(() => [key, null])
              )
            );
            entries.forEach(([key, val]) => {
              if (val) { state.rates[key] = val; } else { anyFailed = true; }
            });
            state.ratesUpdatedAt = new Date().toISOString();
          } catch (e) {
            console.error("Erro ao buscar taxas do Banco Central:", e);
            anyFailed = true;
          }
          state.ratesError = anyFailed;
          state.ratesLoading = false;
          render();
        }

        // Calcula o valor estimado atual de uma posição com base no indexador vinculado
        function calcValorAtualizado(inv) {
          const valorAplicado = Number(inv.valor) || 0;
          if (!inv.data || !inv.indexador || inv.indexador === "Nenhum") return valorAplicado;

          const dataAplic = new Date(inv.data + "T00:00:00");
          const hoje = new Date();
          const dias = Math.max(0, (hoje - dataAplic) / (1000 * 60 * 60 * 24));
          const anos = dias / 365;
          const taxaRef = Number(inv.taxa) || 0;

          let taxaAnual = null;
          if (inv.indexador === "CDI" && state.rates.cdi?.valor != null) {
            taxaAnual = (state.rates.cdi.valor / 100) * (taxaRef / 100);
          } else if (inv.indexador === "SELIC" && state.rates.selic?.valor != null) {
            taxaAnual = (state.rates.selic.valor / 100) * (taxaRef / 100);
          } else if (inv.indexador === "IPCA+" && state.rates.ipca12?.valor != null) {
            taxaAnual = (state.rates.ipca12.valor / 100) + (taxaRef / 100);
          } else if (inv.indexador === "Prefixado") {
            taxaAnual = taxaRef / 100;
          }

          if (taxaAnual == null) return valorAplicado;
          return valorAplicado * Math.pow(1 + taxaAnual, anos);
        }

        // Retorna um rótulo legível da taxa vinculada, ex: "100% do CDI (13,25% a.a.)"
        function labelIndexador(inv) {
          if (!inv.indexador || inv.indexador === "Nenhum") return "Sem indexador";
          const taxaRef = Number(inv.taxa) || 0;
          if (inv.indexador === "CDI") {
            const atual = state.rates.cdi?.valor;
            const fonte = state.rates.cdi?.data === "manual" ? " manual" : "";
            return `${taxaRef}% do CDI${atual != null ? ` (CDI${fonte}: ${atual.toFixed(2)}% a.a.)` : ""}`;
          }
          if (inv.indexador === "SELIC") {
            const atual = state.rates.selic?.valor;
            const fonte = state.rates.selic?.data === "manual" ? " manual" : "";
            return `${taxaRef}% da SELIC${atual != null ? ` (SELIC${fonte}: ${atual.toFixed(2)}% a.a.)` : ""}`;
          }
          if (inv.indexador === "IPCA+") {
            const atual = state.rates.ipca12?.valor;
            const fonte = state.rates.ipca12?.data === "manual" ? " manual" : "";
            return `IPCA + ${taxaRef}% a.a.${atual != null ? ` (IPCA${fonte} 12m: ${atual.toFixed(2)}%)` : ""}`;
          }
          if (inv.indexador === "Prefixado") {
            return `Prefixado ${taxaRef}% a.a.`;
          }
          return inv.indexador;
        }

        function renderFinancas(accent) {
          const { y, m } = state.financeCursor;
          const currentMonthKey = `${y}-${String(m + 1).padStart(2, "0")}`;

          let activeCardTx = [];
          state.transactions.forEach(t => {

            const [pY, pM, pD] = t.data.split("-").map(Number);
            
            for (let i = 0; i < totalParcelas; i++) {
              let targetM = pM - 1 + i;
              let targetY = pY + Math.floor(targetM / 12);
              targetM = targetM % 12;
              
              const installmentMonthKey = `${targetY}-${String(targetM + 1).padStart(2, "0")}`;
              if (installmentMonthKey === currentMonthKey) {
                activeCardTx.push({
                  ...t,
                  parcelaAtual: i + 1,
                  totalParcelas: totalParcelas,
                  displayId: `${t.id}-p${i+1}`
                });
              }
            }
          });

          const activePix = state.pixTransactions.filter(p => p.data.startsWith(currentMonthKey));
          const activeIncomes = state.incomes.filter(i => i.data.startsWith(currentMonthKey));

          const card = state.cards.find(c => c.id === state.activeCardId) || state.cards[0];
          const cardTxFiltered = activeCardTx.filter(t => t.cardId === card?.id).sort((a,b) => b.data.localeCompare(a.data));
          const cardTotal = cardTxFiltered.reduce((s, t) => s + Number(t.valor || 0), 0);
          
          const totalCartoesMonth = activeCardTx.reduce((s, t) => s + Number(t.valor || 0), 0);
          const totalPixMonth = activePix.reduce((s, p) => s + Number(p.valor || 0), 0);
          const totalDespesasMonth = totalCartoesMonth + totalPixMonth;
          const totalReceitasMonth = activeIncomes.reduce((s, i) => s + Number(i.valor || 0), 0);
          const saldoRemanescenteMonth = totalReceitasMonth - totalDespesasMonth;

          return `
            <div class="flex flex-col gap-6">
              <!-- Seletor de Mês da Aba de Finanças -->
              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4 flex items-center justify-between">
                <button onclick="window.changeFinanceMonth(-1)" class="p-1.5 rounded hover:bg-[#232B35] text-[#8A8F98]"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <h2 class="font-serif text-xl tracking-wide" style="color: ${accent}">Mês Referência: ${monthNames[m]} ${y}</h2>
                <button onclick="window.changeFinanceMonth(1)" class="p-1.5 rounded hover:bg-[#232B35] text-[#8A8F98]"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>

              <!-- Cards de Resumo Financeiro do Mês -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4 flex flex-col justify-between">
                  <div class="flex justify-between items-center text-xs uppercase tracking-widest text-[#8A8F98]">
                    <span>Receitas do Mês</span>
                    <button onclick="window.openIncomeForm()" class="text-emerald-400 hover:text-emerald-300 font-bold px-1 text-sm" title="Adicionar Receita">＋</button>
                  </div>
                  <div class="font-mono text-2xl mt-2 text-emerald-400">${brl(totalReceitasMonth)}</div>
                  <span class="text-[10px] text-[#8A8F98] mt-1">${activeIncomes.length} entrada(s) neste mês</span>
                </div>

                <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4 flex flex-col justify-between">
                  <div class="flex justify-between items-center text-xs uppercase tracking-widest text-[#8A8F98]">
                    <span>Despesas do Mês</span>
                    <span class="text-rose-400 font-mono text-xs">Faturas + PIX</span>
                  </div>
                  <div class="font-mono text-2xl mt-2 text-rose-400">${brl(totalDespesasMonth)}</div>
                  <span class="text-[10px] text-[#8A8F98] mt-1">Faturas: ${brl(totalCartoesMonth)} | PIX: ${brl(totalPixMonth)}</span>
                </div>

                <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4 flex flex-col justify-between border-l-4" style="border-left-color: ${saldoRemanescenteMonth >= 0 ? '#4F8C82' : '#C2604A'}">
                  <span class="text-xs uppercase tracking-widest text-[#8A8F98]">Saldo Remanescente</span>
                  <div class="font-mono text-2xl mt-2" style="color: ${saldoRemanescenteMonth >= 0 ? accent : '#C2604A'}">${brl(saldoRemanescenteMonth)}</div>
                  <span class="text-[10px] text-[#8A8F98] mt-1">Receitas menos despesas do mês</span>
                </div>
              </div>

              <!-- Seção de Cartões de Crédito -->
              <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-serif text-lg text-[#EDE6D8]">Faturas dos Cartões (${monthNames[m]})</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  ${state.cards.map(c => {
                    const totalC = activeCardTx.filter(t => t.cardId === c.id).reduce((s, t) => s + Number(t.valor || 0), 0);
                    const active = c.id === state.activeCardId;
                    const isEditing = state.editingCardNameId === c.id;
                    return `
                      <button onclick="window.setActiveCard('${c.id}')" class="text-left rounded-xl p-4 border transition-colors relative" style="border-color: ${active ? accent : "#2A313C"}; background: ${active ? "#1B2129" : "#161B22"};">
                        <div class="flex items-center justify-between mb-3">
                          <i data-lucide="credit-card" class="w-4 h-4" style="color: ${active ? accent : "#8A8F98"}"></i>
                          ${isEditing ? `
                            <input autofocus class="bg-transparent border-b border-[#2A313C] text-xs text-right w-24 outline-none text-[#EDE6D8]" value="${c.nome}" onclick="event.stopPropagation()" onblur="window.saveCardName('${c.id}', this.value)" onkeydown="if(event.key==='Enter')this.blur()" />
                          ` : `
                            <span class="text-xs uppercase tracking-wide text-[#8A8F98]" onclick="event.stopPropagation(); window.editCardName('${c.id}')">${c.nome} ✎</span>
                          `}
                        </div>
                        <div class="font-mono text-lg" style="color: ${active ? accent : "#EDE6D8"}">${brl(totalC)}</div>
                        <div class="text-[10px] text-[#8A8F98] mt-1">${activeCardTx.filter(t => t.cardId === c.id).length} item(ns) na fatura</div>
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>

              <!-- Lançamentos do Cartão no Mês Selecionado -->
              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-serif text-[#EDE6D8]">${card?.nome} — Fatura de ${monthNames[m]}</h3>
                  <button onclick="window.openTxForm()" class="p-1.5 rounded-md flex items-center gap-1 text-xs font-semibold" style="background: ${accent}; color: #12171E;">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova compra parcelada
                  </button>
                </div>
                <div class="flex flex-col gap-2 max-h-[300px] overflow-y-auto pr-1">
                  ${cardTxFiltered.length === 0 ? `<p class="text-xs text-[#8A8F98]">Nenhum gasto neste cartão para ${monthNames[m]}.</p>` : ""}
                  ${cardTxFiltered.map(t => `
                    <div class="flex items-center justify-between bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-sm">
                      <div>
                        <div class="text-[#EDE6D8] flex items-center gap-2">
                          <span>${t.descricao}</span>
                          ${Number(t.parcelas) > 1 ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[#232B35] text-[#C9A24B]">Parc. ${t.parcelaAtual}/${t.parcelas}</span>` : ""}
                        </div>
                        <div class="text-[10px] text-[#8A8F98] font-mono">Compra em ${t.data} · ${t.categoria}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="font-mono text-[#C2604A]">${brl(t.valor)}</span>
                        <button onclick="window.editTx('${t.id}')" title="Editar compra" class="text-[#8A8F98] hover:text-[#C9A24B]"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                        <button onclick="window.removeTx('${t.id}')" title="Excluir compra original" class="text-[#8A8F98] hover:text-[#C2604A]"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  `).join("")}
                </div>
                <div class="mt-3 pt-3 border-t border-[#2A313C] flex justify-between text-sm font-mono">
                  <span class="text-[#8A8F98]">Total fatura ${monthNames[m]} (${card?.nome})</span>
                  <span style="color: ${accent}">${brl(cardTotal)}</span>
                </div>
              </div>

              <!-- Gastos via PIX no Mês -->
              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-serif text-[#EDE6D8]">Gastos via PIX / Transferências (${monthNames[m]})</h3>
                  <button onclick="window.openPixForm()" class="p-1.5 rounded-md flex items-center gap-1 text-xs font-semibold bg-cyan-700 text-[#EDE6D8] hover:opacity-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo PIX / Gasto
                  </button>
                </div>
                <div class="flex flex-col gap-2 max-h-[240px] overflow-y-auto pr-1">
                  ${activePix.length === 0 ? `<p class="text-xs text-[#8A8F98]">Nenhum PIX registrado em ${monthNames[m]}.</p>` : ""}
                  ${activePix.sort((a,b)=>b.data.localeCompare(a.data)).map(p => `
                    <div class="flex items-center justify-between bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-sm">
                      <div>
                        <div class="text-[#EDE6D8]">${p.descricao} ${p.destino ? '<span class="text-xs text-[#8A8F98]">para ' + p.destino + '</span>' : ''}</div>
                        <div class="text-[10px] text-[#8A8F98] font-mono">${p.data} · ${p.categoria}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="font-mono text-rose-400">${brl(p.valor)}</span>
                        <button onclick="window.editPix('${p.id}')" class="text-[#8A8F98] hover:text-cyan-400"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                        <button onclick="window.removePix('${p.id}')" class="text-[#8A8F98] hover:text-[#C2604A]"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  `).join("")}
                </div>
                <div class="mt-3 pt-3 border-t border-[#2A313C] flex justify-between text-sm font-mono">
                  <span class="text-[#8A8F98]">Total PIX em ${monthNames[m]}</span>
                  <span class="text-rose-400">${brl(totalPixMonth)}</span>
                </div>
              </div>

              <!-- Receitas do Mês (lista) -->
              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-serif text-[#EDE6D8]">Receitas / Entradas (${monthNames[m]})</h3>
                  <button onclick="window.openIncomeForm()" class="p-1.5 rounded-md flex items-center gap-1 text-xs font-semibold bg-emerald-600 text-[#12171E] hover:opacity-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova Receita
                  </button>
                </div>
                <div class="flex flex-col gap-2 max-h-[240px] overflow-y-auto pr-1">
                  ${activeIncomes.length === 0 ? `<p class="text-xs text-[#8A8F98]">Nenhuma receita registrada em ${monthNames[m]}.</p>` : ""}
                  ${activeIncomes.sort((a,b)=>b.data.localeCompare(a.data)).map(i => `
                    <div class="flex items-center justify-between bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-sm">
                      <div>
                        <div class="text-[#EDE6D8]">${i.descricao}</div>
                        <div class="text-[10px] text-[#8A8F98] font-mono">${i.data}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="font-mono text-emerald-400">${brl(i.valor)}</span>
                        <button onclick="window.editIncome('${i.id}')" class="text-[#8A8F98] hover:text-emerald-400"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                        <button onclick="window.removeIncome('${i.id}')" class="text-[#8A8F98] hover:text-[#C2604A]"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  `).join("")}
                </div>
                <div class="mt-3 pt-3 border-t border-[#2A313C] flex justify-between text-sm font-mono">
                  <span class="text-[#8A8F98]">Total receitas ${monthNames[m]}</span>
                  <span class="text-emerald-400">${brl(totalReceitasMonth)}</span>
                </div>
              </div>
            </div>
          `;
        }

        window.changeFinanceMonth = (dir) => {
          let { y, m } = state.financeCursor;
          m += dir;
          if (m > 11) { m = 0; y++; }
          else if (m < 0) { m = 11; y--; }
          state.financeCursor = { y, m };
          render();
        };

        window.setActiveCard = (id) => { state.activeCardId = id; render(); };
        window.editCardName = (id) => { state.editingCardNameId = id; render(); };
        window.saveCardName = (id, newName) => {
          state.cards = state.cards.map(c => c.id === id ? { ...c, nome: newName || c.nome } : c);
          state.editingCardNameId = null;
          persistData();
          render();
        };

        window.openTxForm = () => {
          state.editingTxId = null;
          state.txForm = { descricao: "", valor: "", categoria: CATS[0], data: todayISO(), parcelas: "1" };
          state.showTxForm = true;
          render();
        };
        window.editTx = (id) => {
          const t = state.transactions.find(t => t.id === id);
          if (!t) return;
          state.editingTxId = id;
          state.txForm = { descricao: t.descricao, valor: t.valor, categoria: t.categoria, data: t.data, parcelas: t.parcelas || "1" };
          state.showTxForm = true;
          render();
        };
        window.closeTxForm = () => { state.showTxForm = false; state.editingTxId = null; render(); };
        window.removeTx = (id) => {
          state.transactions = state.transactions.filter(t => t.id !== id);
          persistData();
          render();
        };

        window.openPixForm = () => {
          state.editingPixId = null;
          state.pixForm = { descricao: "", valor: "", categoria: CATS[0], data: todayISO(), destino: "" };
          state.showPixForm = true;
          render();
        };
        window.editPix = (id) => {
          const p = state.pixTransactions.find(p => p.id === id);
          if (!p) return;
          state.editingPixId = id;
          state.pixForm = { descricao: p.descricao, valor: p.valor, categoria: p.categoria, data: p.data, destino: p.destino || "" };
          state.showPixForm = true;
          render();
        };
        window.closePixForm = () => { state.showPixForm = false; state.editingPixId = null; render(); };
        window.removePix = (id) => {
          state.pixTransactions = state.pixTransactions.filter(p => p.id !== id);
          persistData();
          render();
        };

        window.openIncomeForm = () => {
          state.editingIncomeId = null;
          state.incomeForm = { descricao: "", valor: "", data: todayISO() };
          state.showIncomeForm = true;
          render();
        };
        window.editIncome = (id) => {
          const i = state.incomes.find(i => i.id === id);
          if (!i) return;
          state.editingIncomeId = id;
          state.incomeForm = { descricao: i.descricao, valor: i.valor, data: i.data };
          state.showIncomeForm = true;
          render();
        };
        window.closeIncomeForm = () => { state.showIncomeForm = false; state.editingIncomeId = null; render(); };
        window.removeIncome = (id) => {
          state.incomes = state.incomes.filter(i => i.id !== id);
          persistData();
          render();
        };

        // ================= INVESTIMENTOS =================
        function renderInvestimentos(accent) {
          const total = state.investments.reduce((s, i) => s + Number(i.valor || 0), 0);
          const totalAtualizado = state.investments.reduce((s, i) => s + calcValorAtualizado(i), 0);
          const rendimentoTotal = totalAtualizado - total;
          const byTypeMap = {};
          state.investments.forEach(i => { byTypeMap[i.tipo] = (byTypeMap[i.tipo] || 0) + calcValorAtualizado(i); });
          const byType = Object.entries(byTypeMap).sort((a,b) => b[1] - a[1]);

          const rateUpdatedLabel = state.ratesUpdatedAt
            ? new Date(state.ratesUpdatedAt).toLocaleString("pt-BR")
            : "ainda não sincronizado";

          return `
            <div class="flex flex-col gap-6">
              <div class="grid sm:grid-cols-2 gap-4">
                <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-5 flex flex-col items-start relative">
                  <div class="flex items-center justify-between w-full mb-1">
                    <span class="text-xs uppercase tracking-widest text-[#8A8F98]">Patrimônio investido (atualizado automaticamente)</span>
                    <button onclick="window.refreshRates()" title="Atualizar valor total da carteira" class="flex items-center gap-1.5 text-[10px] font-bold px-2.5 py-1.5 rounded-md shadow transition hover:brightness-110 disabled:opacity-60 shrink-0" style="background: ${accent}; color: #12171E;" ${state.ratesLoading ? "disabled" : ""}>
                      <i data-lucide="refresh-cw" class="w-3.5 h-3.5 ${state.ratesLoading ? "animate-spin" : ""}"></i> ${state.ratesLoading ? "Atualizando..." : "Atualizar carteira"}
                    </button>
                  </div>
                  <span class="font-mono text-3xl mt-2" style="color: ${accent}">${brl(totalAtualizado)}</span>
                  <span class="text-xs text-[#8A8F98] mt-1">
                    ${state.investments.length} posição(ões) · aportado: <span class="font-mono">${brl(total)}</span>
                    · rendimento: <span class="font-mono ${rendimentoTotal >= 0 ? "text-emerald-400" : "text-[#C2604A]"}">${rendimentoTotal >= 0 ? "+" : ""}${brl(rendimentoTotal)}</span>
                  </span>
                </div>
                <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-5">
                  <span class="text-xs uppercase tracking-widest text-[#8A8F98]">Por tipo (valor atualizado)</span>
                  <div class="mt-2 flex flex-col gap-1.5">
                    ${byType.length === 0 ? `<span class="text-xs text-[#8A8F98]">Sem dados ainda.</span>` : ""}
                    ${byType.map(([t, v]) => `
                      <div class="flex justify-between text-xs">
                        <span class="text-[#EDE6D8]">${t}</span>
                        <span class="font-mono text-[#8A8F98]">${brl(v)}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>

              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4">
                <div class="flex items-center justify-between mb-2 gap-3">
                  <span class="text-xs uppercase tracking-widest text-[#8A8F98]">Taxas de referência (Banco Central)</span>
                  <button onclick="window.refreshRates()" class="flex items-center gap-2 text-xs font-bold px-4 py-2 rounded-md shadow-lg transition hover:brightness-110 disabled:opacity-60" style="background: ${accent}; color: #12171E;" ${state.ratesLoading ? "disabled" : ""}>
                    <i data-lucide="refresh-cw" class="w-4 h-4 ${state.ratesLoading ? "animate-spin" : ""}"></i> ${state.ratesLoading ? "Atualizando..." : "Atualizar taxas"}
                  </button>
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <div class="bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-center">
                    <div class="text-[10px] text-[#8A8F98] uppercase">CDI</div>
                    <div class="font-mono text-sm" style="color: ${accent}">${state.rates.cdi?.valor != null ? state.rates.cdi.valor.toFixed(2) + "% a.a." : "—"}</div>
                  </div>
                  <div class="bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-center">
                    <div class="text-[10px] text-[#8A8F98] uppercase">SELIC</div>
                    <div class="font-mono text-sm" style="color: ${accent}">${state.rates.selic?.valor != null ? state.rates.selic.valor.toFixed(2) + "% a.a." : "—"}</div>
                  </div>
                  <div class="bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-center">
                    <div class="text-[10px] text-[#8A8F98] uppercase">IPCA (12m)</div>
                    <div class="font-mono text-sm" style="color: ${accent}">${state.rates.ipca12?.valor != null ? state.rates.ipca12.valor.toFixed(2) + "%" : "—"}</div>
                  </div>
                </div>
                <div class="text-[10px] text-[#8A8F98] mt-2">Última sincronização: ${rateUpdatedLabel}</div>

                ${state.ratesError || state.rates.cdi?.valor == null || state.rates.selic?.valor == null || state.rates.ipca12?.valor == null ? `
                  <div class="mt-3 pt-3 border-t border-[#2A313C]">
                    <p class="text-[10px] text-amber-400 mb-2">Não foi possível buscar automaticamente uma ou mais taxas (rede/bloqueio do navegador). Você pode inserir manualmente abaixo — isso garante que o valor atualizado continue funcionando.</p>
                    <div class="grid grid-cols-3 gap-2">
                      ${Object.entries(RATE_LABELS).map(([key, label]) => `
                        <div class="flex flex-col gap-1">
                          <label class="text-[9px] text-[#8A8F98] uppercase">${label} (%)</label>
                          <div class="flex gap-1">
                            <input id="f-rate-manual-${key}" type="number" step="0.01" class="input-cls !py-1 !text-xs" placeholder="${state.rates[key]?.valor != null ? state.rates[key].valor.toFixed(2) : "Ex: 14.90"}">
                            <button onclick="window.setManualRate('${key}')" class="px-2 rounded-md text-[10px] font-semibold" style="background: ${accent}; color: #12171E;">OK</button>
                          </div>
                        </div>
                      `).join("")}
                    </div>
                  </div>
                ` : ""}
              </div>

              <div class="bg-[#161B22] border border-[#2A313C] rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-serif text-lg text-[#EDE6D8]">Posições</h3>
                  <button onclick="window.openInvForm()" class="p-1.5 rounded-md" style="background: ${accent}; color: #12171E;"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="flex flex-col gap-2">
                  ${state.investments.length === 0 ? `<p class="text-xs text-[#8A8F98]">Nenhum investimento registrado.</p>` : ""}
                  ${state.investments.map(i => {
                    const atualizado = calcValorAtualizado(i);
                    const rendimento = atualizado - Number(i.valor || 0);
                    return `
                    <div class="flex items-center justify-between bg-[#12171E] border border-[#2A313C] rounded-lg px-3 py-2 text-sm">
                      <div>
                        <div class="text-[#EDE6D8]">${i.nome}</div>
                        <div class="text-[10px] text-[#8A8F98] font-mono">${i.tipo} · ${i.instituicao || "—"} · ${i.data}</div>
                        <div class="text-[10px] font-mono mt-0.5" style="color: ${accent}">${labelIndexador(i)}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <div class="text-right">
                          <div class="font-mono" style="color: ${accent}">${brl(atualizado)}</div>
                          ${rendimento !== 0 ? `<div class="text-[10px] font-mono ${rendimento > 0 ? "text-emerald-400" : "text-[#C2604A]"}">${rendimento > 0 ? "+" : ""}${brl(rendimento)}</div>` : ""}

          if (indexador === "Prefixado") return "Taxa prefixada (% a.a.)";
          return "Taxa (não aplicável)";
        }

                  <div class="flex items-center justify-between border-b border-[#2A313C] pb-3">
                    <h3 class="font-serif text-lg" style="color: ${accent}">Novo projeto</h3>
                    <button onclick="window.closeProjForm()" class="text-[#8A8F98] hover:text-[#EDE6D8]"><i data-lucide="x" class="w-4 h-4"></i></button>
                  </div>
                  <label class="flex flex-col gap-1 text-xs text-[#8A8F98] uppercase tracking-wide">
                    Título
                    <input id="f-proj-titulo" class="input-cls" placeholder="Ex: Reforma da cozinha" value="${state.projForm.titulo}">
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-[#8A8F98] uppercase tracking-wide">
                    Descrição
                    <input id="f-proj-desc" class="input-cls" placeholder="Opcional" value="${state.projForm.descricao}">
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-[#8A8F98] uppercase tracking-wide">
                    Prazo
                    <input id="f-proj-prazo" type="date" class="input-cls" value="${state.projForm.prazo}">
                  </label>
                  <button onclick="window.submitProjForm()" class="mt-2 rounded-md py-2 text-sm font-semibold" style="background: ${accent}; color: #12171E;">
                    Criar projeto
                  </button>
                </div>
              </div>
            `;
          }

          modalRoot.innerHTML = modalHTML;
          lucide.createIcons();
        }

        window.submitShiftForm = () => {
          const local = document.getElementById("f-shift-local").value;
          const data = document.getElementById("f-shift-data").value;
          const inicio = document.getElementById("f-shift-inicio").value;
          const fim = document.getElementById("f-shift-fim").value;
          const valor = document.getElementById("f-shift-valor").value;
          const obs = document.getElementById("f-shift-obs").value;

          if (!local || !valor) return;
          if (state.editingShiftId) {
            state.shifts = state.shifts.map(s => s.id === state.editingShiftId ? { ...s, data: data || s.data, local, inicio, fim, valor, obs } : s);
            state.editingShiftId = null;
          } else {
            state.shifts.push({ id: uid(), data: data || state.selectedDay, local, inicio, fim, valor, obs });
          }
          state.showShiftForm = false;
          persistData();
          render();
        };

          const instituicao = document.getElementById("f-inv-inst").value;

          if (!nome || !valor) return;

        window.submitProjForm = () => {
          const titulo = document.getElementById("f-proj-titulo").value;
          const descricao = document.getElementById("f-proj-desc").value;
          const prazo = document.getElementById("f-proj-prazo").value;

          if (!titulo) return;
          state.projects.push({ id: uid(), titulo, descricao, prazo, status: "planejado", tasks: [] });
